name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./cmd/kfs
      - run: go vet ./...
      - run: go test ./... -v

      - name: Test mock server
        run: |
          ./kfs run --mock &
          sleep 2
          echo "Mock server test complete"

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/kfs-linux-amd64 ./cmd/kfs
          GOOS=linux GOARCH=arm64 go build -o dist/kfs-linux-arm64 ./cmd/kfs
          GOOS=darwin GOARCH=amd64 go build -o dist/kfs-darwin-amd64 ./cmd/kfs
          GOOS=darwin GOARCH=arm64 go build -o dist/kfs-darwin-arm64 ./cmd/kfs
          GOOS=windows GOARCH=amd64 go build -o dist/kfs-windows-amd64.exe ./cmd/kfs

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
